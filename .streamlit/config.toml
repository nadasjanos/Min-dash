# .streamlit/config.toml
# EZ A FÁJL: a Streamlit beállításai.
# - gatherUsageStats = false: a Streamlit ne küldjön használati statisztikát
#   az internetre (alapból küldene!).
# Azt, hogy az app csak a saját gépedről legyen elérhető (localhost), az
# inditas.bat állítja be (--server.address localhost). Itt azért nincs, mert
# az online bemutató (Streamlit Community Cloud) ezzel a beállítással nem indulna.

[browser]
gatherUsageStats = false
